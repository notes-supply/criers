{{- if not .Values.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "criers.claimName" . }}
  labels:
    {{- include "criers.labels" . | nindent 4 }}
  {{- if or .Values.persistence.retainOnUninstall .Values.persistence.annotations }}
  annotations:
    {{- if .Values.persistence.retainOnUninstall }}
    # Uninstalling the release keeps the claim and its alert history.
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .Values.persistence.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
