name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Workspace checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1, Node 24
        with:
          version: 2026.10.7
          install_args: --locked rust aqua:nextest-rs/nextest/cargo-nextest
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Restore dependency compilation
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, Node 24
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Check workspace
        run: mise run ci

  packaging:
    name: Kubernetes packaging and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1, Node 24
        with:
          version: 2026.10.7
          install_args: >-
            --locked aqua:kubernetes-sigs/kustomize aqua:yannh/kubeconform aqua:helm/helm
            aqua:mikefarah/yq aqua:rhysd/actionlint aqua:zizmorcore/zizmor
          cache_key_prefix: mise-packaging
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Validate the Kustomize manifests
        run: mise run manifests
      - name: Check the Helm chart
        run: mise run chart
      - name: Lint workflows
        run: mise run workflows
