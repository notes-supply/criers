[package]
name = "alert-router"
version = "0.1.0"
edition = "2024"
publish = false
description = "Durable, event-driven alert routing with explicit notification policy"
authors = ["Jonatan Jonasson <jonatan.jonasson@notes.supply>"]

[dependencies]
anyhow = "1"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["now", "serde", "std"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower-http = { version = "0.7.1", features = ["timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
