[workspace]
members = ["crates/core", "crates/server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Jonatan Jonasson <jonatan.jonasson@notes.supply>"]
license = "MIT"
repository = "https://github.com/notes-supply/criers"
publish = false

[workspace.dependencies]
criers-core = { path = "crates/core" }
anyhow = "1"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.1", features = ["timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
