[workspace]
members = ["crates/core", "crates/server"]
resolver = "3"

[workspace.package]
version = "0.3.1"
edition = "2024"
authors = ["Jonatan Jonasson <jonatan.jonasson@notes.supply>"]
license = "MIT"
repository = "https://github.com/notes-supply/criers"
publish = false

[workspace.dependencies]
criers-core = { path = "crates/core" }
anyhow = "1"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
fastrand = "2.5"
http-body-util = "0.1.5"
humantime = "2.4"
prometheus-client = "0.25.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
secrecy = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
subtle = "2.6"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.1", features = ["timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
