[tools]
rust = { version = "nightly-2026-10-10", profile = "minimal", components = "rustfmt,clippy,rust-src" }
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.148"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "Lint every target"
run = "cargo clippy --all-targets --all-features --locked -- -D warnings"

[tasks.test]
description = "Run regression tests and separate doctests"
run = ["cargo nextest run --all-targets --locked", "cargo test --doc --locked"]

[tasks.build]
description = "Build the runnable service"
run = "cargo build --locked"

[tasks.dev]
description = "Start the receiver in shadow-only mode"
run = "cargo run --locked"

[tasks.ci]
description = "Run the required source and behavior checks"
depends = ["fmt"]
run = ["mise run lint", "mise run test", "mise run build"]
