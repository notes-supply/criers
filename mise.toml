[tools]
rust = { version = "nightly-2026-10-10", profile = "minimal", components = "rustfmt,clippy,rust-src" }
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.148"
"aqua:kubernetes-sigs/kustomize" = "5.8.3"
"aqua:yannh/kubeconform" = "0.8.0"
"aqua:helm/helm" = "4.3.0"
"aqua:mikefarah/yq" = "4.54.1"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.30.1"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "Lint every target"
run = "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings"

[tasks.test]
description = "Run regression tests and separate doctests"
run = ["cargo nextest run --workspace --all-targets --locked", "cargo test --workspace --doc --locked"]

[tasks.build]
description = "Build the runnable service"
run = "cargo build --workspace --locked"

[tasks.dev]
description = "Start Criers with the example configuration"
run = "cargo run --package criers --locked -- serve --config examples/criers.toml"

[tasks.manifests]
description = "Render and validate the Kubernetes manifests"
run = [
  "mkdir -p target",
  "kustomize build deploy/kubernetes -o target/kubernetes.yaml",
  "kubeconform -strict -summary -kubernetes-version 1.34.0 target/kubernetes.yaml",
]

[tasks.chart]
description = "Lint, render, validate, check and package the Helm chart"
run = "bash charts/criers/tests/contract.sh target/chart"

[tasks.workflows]
description = "Lint the GitHub Actions workflows"
run = ["actionlint", "zizmor --offline .github/workflows"]

[tasks.release-check]
description = "Check that RELEASE_TAG matches the crate, chart and app versions"
run = """
crate=$(yq -p toml -oy '.workspace.package.version' Cargo.toml)
chart=$(yq '.version' charts/criers/Chart.yaml)
app=$(yq '.appVersion' charts/criers/Chart.yaml)
tag="${RELEASE_TAG:?set RELEASE_TAG, for example v0.1.0}"
if [ "$tag" != "v$crate" ] || [ "$chart" != "$crate" ] || [ "$app" != "$crate" ]; then
  echo "version mismatch: tag=$tag crate=$crate chart=$chart appVersion=$app" >&2
  exit 1
fi
echo "release $tag: crate, chart and appVersion are $crate"
"""

[tasks.image]
description = "Build the release OCI image"
run = "docker build -t criers:dev ."

[tasks.ci]
description = "Run the required source and behavior checks"
depends = ["fmt"]
run = ["mise run lint", "mise run test", "mise run build"]
