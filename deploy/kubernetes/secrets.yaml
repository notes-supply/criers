# Placeholders fail validation on purpose (they contain spaces), so applying them
# unchanged stops Criers at startup instead of accepting a guessable credential.
# Replace them from your secret manager; never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: criers-source-tokens
type: Opaque
stringData:
  alertmanager-token: "replace with 32 to 256 random printable characters"
---
apiVersion: v1
kind: Secret
metadata:
  name: criers-destinations
type: Opaque
stringData:
  discord-ops-url: "replace with https://discord.com/api/webhooks/<id>/<token>"
