apiVersion: apps/v1
kind: Deployment
metadata:
  name: criers
spec:
  # SQLite has one writer: never run two replicas or overlap pods during rollout.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {}
  template:
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: criers
          # Build and push your own image; this reference is a placeholder.
          image: registry.example.invalid/criers:0.1.0
          args: ["serve", "--config", "/etc/criers/criers.toml"]
          ports:
            - name: ingest
              containerPort: 8080
            - name: ops
              containerPort: 9090
          startupProbe:
            httpGet:
              path: /health/live
              port: ops
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: ops
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: ops
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/criers
              readOnly: true
            # Projected volumes update atomically; Criers polls them for rotation.
            # Do not use subPath here: subPath mounts never receive updates.
            - name: secrets
              mountPath: /run/secrets/criers
              readOnly: true
            - name: data
              mountPath: /var/lib/criers
      volumes:
        - name: config
          configMap:
            name: criers-config
        - name: secrets
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: criers-source-tokens
              - secret:
                  name: criers-destinations
        - name: data
          persistentVolumeClaim:
            claimName: criers-data
