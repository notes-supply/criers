apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: criers
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: criers
resources:
  - namespace.yaml
  - secrets.yaml
  - persistentvolumeclaim.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: criers-config
    files:
      - criers.toml
